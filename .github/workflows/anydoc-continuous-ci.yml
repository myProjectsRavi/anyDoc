name: AnyDoc Continuous CI

on:
  push:
    branches:
      - codex/anydoc-continuous-improvement
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anydoc-continuous-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-verify:
    name: Android build, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Core PDF unit tests
        run: ./gradlew --no-daemon :core:pdf:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug
