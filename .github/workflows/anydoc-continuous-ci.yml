name: AnyDoc Continuous CI

on:
  push:
    branches:
      - codex/anydoc-continuous-improvement
    paths-ignore:
      - "docs/codex-continuous-improvement/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/codex-continuous-improvement/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push + draft-PR events for this branch share one validation lane.
  group: anydoc-continuous-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android-verify:
    name: Android build, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Core PDF unit tests
        run: ./gradlew --no-daemon :core:pdf:testDebugUnitTest

      - name: Converter unit tests
        run: ./gradlew --no-daemon :feature:converter:testDebugUnitTest

      - name: Scanner unit tests
        run: ./gradlew --no-daemon :feature:scanner:testDebugUnitTest

      - name: PDF tools signature unit tests
        run: ./gradlew --no-daemon :feature:pdf-tools:testDebugUnitTest

      - name: App lifecycle unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Assemble release (unsigned, R8)
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug
